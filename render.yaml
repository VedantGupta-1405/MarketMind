services:
  # 1. Spring Boot Backend API
  - type: web
    name: marketmind-backend
    env: docker
    dockerfilePath: ./AI_Investment_System_Backend/Dockerfile
    dockerContext: ./AI_Investment_System_Backend
    plan: starter
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: marketmind-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: marketmind-db
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: marketmind-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: marketmind-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: marketmind-db
          property: password
      - key: ML_SERVICE_URL
        value: http://marketmind-ml:8000
      - key: FINNHUB_API_KEY
        sync: false

  # 2. FastAPI ML & Sentiment Service
  - type: web
    name: marketmind-ml
    env: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: starter
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

# 3. PostgreSQL Database
databases:
  - name: marketmind-db
    databaseName: investment_system
    user: marketmind_user
    plan: starter
    region: oregon
